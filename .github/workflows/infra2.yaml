name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action_type:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set GCP Project
        run: |
          echo "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        if: inputs.action_type == 'init'
        run: terraform init -backend-config="backend-configs/${{ inputs.environment }}.tfvars"

      - name: Terraform Plan
        if: inputs.action_type == 'plan'
        run: terraform plan -var-file="terraform.tfvars" -input=false

      - name: Terraform Apply
        if: inputs.action_type == 'apply'
        run: terraform apply -var-file="terraform.tfvars" -auto-approve

      - name: Terraform Destroy
        if: inputs.action_type == 'destroy'
        run: terraform destroy -var-file="terraform.tfvars" -auto-approve
